<!doctype html>
<html lang="id">
  <head>
    <script>
      // Filter out benign [vite] websocket / HMR connection logs in sandboxed preview iframe
      (function() {
        const checkVite = (val) => {
          if (!val) return false;
          if (typeof val === 'string' && (val.includes('[vite]') || val.includes('failed to connect to websocket'))) return true;
          if (typeof val === 'object' && val.message && typeof val.message === 'string' && (val.message.includes('[vite]') || val.message.includes('failed to connect to websocket'))) return true;
          return false;
        };

        ['error', 'warn', 'info', 'log', 'debug'].forEach((method) => {
          const orig = console[method];
          console[method] = function(...args) {
            if (args.some(checkVite)) return;
            orig.apply(console, args);
          };
        });

        window.addEventListener('error', function(e) {
          if (checkVite(e.message) || checkVite(e.error)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (checkVite(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
